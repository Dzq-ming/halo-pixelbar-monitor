name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Check Windows sensor snapshot contention
        shell: powershell
        run: .\tests\test_sensor_snapshot.ps1
      - run: python scripts/check_public_files.py
      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $sources = Get-ChildItem -Recurse -Filter *.ps1
          foreach ($source in $sources) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell parse failed: $($source.Name)" }
          }
